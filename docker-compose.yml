name: envocc-media

services:
  upload-permissions:
    build:
      context: ./frontend
    user: "0:0"
    command:
      - /bin/sh
      - -c
      - chown -R node:node /app/fileuploads /app/fileborrows /app/filerequisitions
    volumes:
      - fileuploads-data:/app/fileuploads
      - fileborrows-data:/app/fileborrows
      - filerequisitions-data:/app/filerequisitions
    restart: "no"

  frontend:
    build:
      context: ./frontend
    depends_on:
      upload-permissions:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    env_file:
      - ./frontend/.env
    networks:
      - internal_net
    restart: unless-stopped
    volumes:
      - fileuploads-data:/app/fileuploads
      - fileborrows-data:/app/fileborrows
      - filerequisitions-data:/app/filerequisitions
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"const net = require('net'); const socket = net.createConnection(3000, '127.0.0.1'); socket.setTimeout(3000); socket.on('connect', () => { socket.destroy(); process.exit(0); }); socket.on('timeout', () => { socket.destroy(); process.exit(1); }); socket.on('error', () => process.exit(1));\"" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - fileuploads-data:/app/fileuploads
      - fileborrows-data:/app/fileborrows
      - filerequisitions-data:/app/filerequisitions
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - internal_net
    restart: unless-stopped

  db:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-media}
      MYSQL_USER: ${DB_USER:-myuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - internal_net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  fileuploads-data:
    name: fileuploads-data
  fileborrows-data:
    name: fileborrows-data
  filerequisitions-data:
    name: filerequisitions-data

networks:
  internal_net:
    name: media_app_net
    driver: bridge
